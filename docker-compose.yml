# ============================================================
#  Docker Compose - Plataforma BI Soporte Especializado
#  En FASE 1 levantamos solo PostgreSQL + pgAdmin para que
#  el backend tenga a dónde conectarse. El empaquetado completo
#  de backend/frontend en imágenes se detalla en la FASE 6.
# ============================================================
services:
  postgres:
    image: postgres:15-alpine
    container_name: bi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_clave}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_bi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bi_user} -d ${POSTGRES_DB:-restaurant_bi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bi_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@restaurant.pe
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  bi_pgdata:
